<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task & Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1 class="app-name">Dynamic Task & Habit Tracker</h1>

    <div class="header">
        <p>Total: <span class="js-total-tasks"></span></p>
        <p>Completed: <span class="js-completed-tasks"></span></p>
        <p>Progess: <span class="js-progress">78%</span></p>
    </div>
    
    <div class="form-section js-form-section">
        <h3 id="formTitle">Add New Task</h3> 
        <form action="" class="form-data js-form-data">
            <input type="text" name="task-title" class="task-input-title js-task-input" placeholder="Task Title...">
            <select name="categories" id="categories">
                <option value="personal">Personal</option>
                <option value="study">Study</option>
                <option value="routine">Routine</option>
            </select>   
            <select name="priorities" id="priorities">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit">Add</button>
        </form>
    </div>

    <div class="controls-bar">
        <div class="filter-group">
            <span class="control-label">Filter:</span>
            <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <div class="sort-group">
            <label for="sort-select" class="control-label">Sort:</label>
            <select name="" id="sort-select" class="sort-select">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="priority-high">Priority(High to Low)</option>
            </select>
        </div>

        <div class="task-list js-task-list">
            
        </div>

    </div>

    <div class="popup-section js-popup-section">
    
    </div>


    <script src="app.js"></script>
</body>
</html>
