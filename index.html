<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task & Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">


</head>
<body>
    
    <div class="app-details">
        <h1 class="app-name">Dynamic Task & Habit Tracker</h1>
        <p>A running record of tasks and habits, kept one entry at a time.</p>
    </div>

    <div class="header">
        <div class="stat">
            <span class="stat-value js-total-tasks">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat">
            <span class="stat-value js-completed-tasks">0</span>
            <span class="stat-label">Completed</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat">
            <span class="stat-value js-progress">0%</span>
            <span class="stat-label">Progress</span>
        </div>
    </div>
    
    <div class="form-section js-form-section">
        <h3 id="formTitle">Add New Task</h3> 
        <form action="" class="form-data js-form-data">
            <input type="text" name="task-title" class="task-input-title js-task-input" placeholder="Task Title...">
            <select name="categories" id="categories">
                <option value="personal">Personal</option>
                <option value="study">Study</option>
                <option value="routine">Routine</option>
            </select>   
            <select name="priorities" id="priorities">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit">Add</button>
        </form>
    </div>

    <div class="controls-bar">
        <div class="filter-group">
            <span class="control-label">Filter:</span>
            <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <div class="sort-group">
            <label for="sort-select" class="control-label">Sort:</label>
            <select name="" class="sort-select js-sort-select">
                <option value="oldest">Oldest</option>
                <option value="newest">Newest</option>
                <option value="priority-high">Priority(High to Low)</option>
            </select>
        </div>

        <div class="task-list js-task-list">
            
        </div>

    </div>

    <div class="popup-section js-popup-section">
    
    </div>


    <script src="app.js"></script>
</body>
</html>
